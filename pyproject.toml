[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "asrp"
version = "0.0.1"
description = "Solver core for driving FEBio from Blender as a replacement physics backend for the lab's facial controller."
readme = "README.md"
requires-python = ">=3.13"
authors = [{ name = "JoKFA", email = "felixwang1222@gmail.com" }]
dependencies = []

[project.scripts]
asrp = "asrp_core.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/asrp_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["spikes", "tools"]
