[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "asrp"
version = "0.0.1"
description = "Solver core for driving FEBio from Blender as a replacement physics backend for the lab's facial controller."
readme = "README.md"
requires-python = ">=3.13"
authors = [{ name = "JoKFA", email = "felixwang1222@gmail.com" }]
dependencies = [
    "numpy>=2",
    "pytetwild>=0.2.3,<0.3",
]

[project.scripts]
asrp = "asrp_core.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.17.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/asrp_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["spikes", "tools"]

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = [".claude/worktrees"]  # other branches' checkouts are linted by their own gate

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# Line length is not enforced: the code is written at about 150 columns.
ignore = [
    "E501",  # line length is not enforced
    "B905",  # zip() without strict=: every zip here pairs sequences built together; strict=False would only add noise
]

[tool.ruff.lint.per-file-ignores]
# Scripts run by Maya's mayapy: written in a terse stdlib-only style, kept as is.
"tools/maya_export.py" = ["UP031", "E741"]
"tools/rehearse_ziva_export.py" = ["UP031", "E702"]
"tools/ziva_machine_export.py" = ["UP031", "E731"]
"tools/ziva_trip_probe.py" = ["UP031"]
